name: Build FRIDAY EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:

      # ============================================
      # 1. Checkout repository
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================
      # 2. Setup Python
      # ============================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================
      # 3. Find FRIDAY project
      # ============================================
      - name: Find FRIDAY project folder
        shell: powershell
        run: |
          Write-Host "Searching repository for pyproject.toml..."

          $files = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "pyproject.toml" `
            -Recurse `
            -File

          if ($files.Count -eq 0) {
            Write-Error "ERROR: pyproject.toml was not found anywhere in the repository."
            Write-Host ""
            Write-Host "Repository contents:"
            Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE `
              -Recurse `
              -File | Select-Object -First 100 FullName
            exit 1
          }

          Write-Host ""
          Write-Host "Found pyproject.toml:"
          $files | ForEach-Object {
            Write-Host $_.FullName
          }

          $project = $files[0]
          $projectDir = $project.Directory.FullName

          Write-Host ""
          Write-Host "============================================"
          Write-Host "FRIDAY PROJECT DIRECTORY"
          Write-Host $projectDir
          Write-Host "============================================"

          "PROJECT_DIR=$projectDir" >> $env:GITHUB_ENV


      # ============================================
      # 4. Verify project
      # ============================================
      - name: Verify FRIDAY project
        shell: powershell
        run: |
          Write-Host "Project directory:"
          Write-Host $env:PROJECT_DIR
          Write-Host ""

          if (!(Test-Path "$env:PROJECT_DIR\pyproject.toml")) {
            Write-Error "pyproject.toml not found."
            exit 1
          }

          if (!(Test-Path "$env:PROJECT_DIR\agent_friday.py")) {
            Write-Error "agent_friday.py not found."
            exit 1
          }

          if (!(Test-Path "$env:PROJECT_DIR\server.py")) {
            Write-Error "server.py not found."
            exit 1
          }

          Write-Host "FRIDAY files found."
          Write-Host ""

          Get-ChildItem `
            -Path $env:PROJECT_DIR `
            -Force


      # ============================================
      # 5. Upgrade pip
      # ============================================
      - name: Upgrade Python tools
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel


      # ============================================
      # 6. Install FRIDAY dependencies
      # ============================================
      - name: Install FRIDAY dependencies
        shell: powershell
        run: |
          Set-Location "$env:PROJECT_DIR"

          Write-Host "Installing FRIDAY from:"
          Get-Location

          python -m pip install -e .


      # ============================================
      # 7. Install PyInstaller
      # ============================================
      - name: Install PyInstaller
        shell: powershell
        run: |
          python -m pip install --upgrade pyinstaller


      # ============================================
      # 8. Verify PyInstaller
      # ============================================
      - name: Verify PyInstaller
        shell: powershell
        run: |
          python -m PyInstaller --version


      # ============================================
      # 9. Build FRIDAY Voice
      # ============================================
      - name: Build FRIDAY Voice EXE
        shell: powershell
        run: |
          Set-Location "$env:PROJECT_DIR"

          Write-Host "Building FRIDAY Voice EXE..."

          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --name "FRIDAY-Voice" `
            "agent_friday.py"

          if (!(Test-Path "$env:PROJECT_DIR\dist\FRIDAY-Voice.exe")) {
            Write-Error "FRIDAY-Voice.exe was not created."
            exit 1
          }

          Write-Host "FRIDAY-Voice.exe created successfully."


      # ============================================
      # 10. Build FRIDAY Server
      # ============================================
      - name: Build FRIDAY Server EXE
        shell: powershell
        run: |
          Set-Location "$env:PROJECT_DIR"

          Write-Host "Building FRIDAY Server EXE..."

          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --name "FRIDAY-Server" `
            "server.py"

          if (!(Test-Path "$env:PROJECT_DIR\dist\FRIDAY-Server.exe")) {
            Write-Error "FRIDAY-Server.exe was not created."
            exit 1
          }

          Write-Host "FRIDAY-Server.exe created successfully."


      # ============================================
      # 11. Prepare release folder
      # ============================================
      - name: Prepare release
        shell: powershell
        run: |
          $release = Join-Path `
            $env:GITHUB_WORKSPACE `
            "release"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $release | Out-Null

          Copy-Item `
            "$env:PROJECT_DIR\dist\FRIDAY-Voice.exe" `
            "$release\FRIDAY-Voice.exe"

          Copy-Item `
            "$env:PROJECT_DIR\dist\FRIDAY-Server.exe" `
            "$release\FRIDAY-Server.exe"

          if (Test-Path "$env:PROJECT_DIR\README.md") {
            Copy-Item `
              "$env:PROJECT_DIR\README.md" `
              "$release\README.md"
          }

          if (Test-Path "$env:PROJECT_DIR\.env.example") {
            Copy-Item `
              "$env:PROJECT_DIR\.env.example" `
              "$release\.env.example"
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "FINAL RELEASE"
          Write-Host "============================================"

          Get-ChildItem `
            -Path $release `
            -Force


      # ============================================
      # 12. Upload EXEs
      # ============================================
      - name: Upload FRIDAY Windows EXEs
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-Windows-EXE
          path: release
          if-no-files-found: error
          retention-days: 30
